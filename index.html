<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aether AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0c10;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      padding-bottom: 240px;
    }
    .topbar {
      position: fixed; top: 0; left: 0; right: 0;
      height: 70px;
      background: rgba(10,12,16,0.95);
      backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; z-index: 100;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .logo { font-size: 30px; font-weight: bold; background: linear-gradient(to right, #2e6ff2, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .container { max-width: 1000px; margin: 100px auto 40px; padding: 0 15px; text-align: center; }
    h1 { font-size: 42px; font-weight: 300; margin-bottom: 8px; }
    .subtitle { color: #aaa; font-size: 19px; }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-top: 40px;
    }
    .gallery img {
      width: 100%; border-radius: 22px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }

    .command-center {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #14171c;
      border-top: 1px solid #2e6ff2;
      border-radius: 28px 28px 0 0;
      padding: 20px 25px 30px;
      box-shadow: 0 -15px 40px rgba(0,0,0,0.8);
    }
    textarea {
      width: 100%; height: 110px;
      background: #0a0c10;
      border: 2px solid #334155;
      border-radius: 18px;
      color: white;
      padding: 18px;
      font-size: 17px;
    }
    button {
      margin-top: 15px;
      width: 100%;
      padding: 18px;
      font-size: 19px;
      background: #2e6ff2;
      color: white;
      border: none;
      border-radius: 18px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="logo">Aether</div>
    <div>AI Studio</div>
  </div>

  <div class="container">
    <h1>Create Something Beautiful</h1>
    <p class="subtitle">Deep Space • Premium AI Image Generator</p>
    
    <div class="gallery" id="gallery"></div>
  </div>

  <!-- Bottom Panel -->
  <div class="command-center">
    <textarea id="prompt" placeholder="কী ছবি বানাতে চাও? বিস্তারিত লেখো..."></textarea>
    <button onclick="generateImage()" id="btn">Generate Image</button>
  </div>

  <script>
    async function generateImage() {
      const prompt = document.getElementById('prompt').value.trim();
      const btn = document.getElementById('btn');
      
      if (!prompt) {
        alert("প্রম্পট লিখো!");
        return;
      }

      btn.innerHTML = "তৈরি হচ্ছে...";
      btn.disabled = true;

      try {
        const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1024&height=1024&nologo=true`;
        const img = document.createElement('img');
        img.src = url;
        document.getElementById('gallery').prepend(img);
      } catch(e) {
        alert("সমস্যা হয়েছে। আবার চেষ্টা করো");
      }

      btn.innerHTML = "Generate Image";
      btn.disabled = false;
      document.getElementById('prompt').value = '';
    }
  </script>
</body>
</html>
