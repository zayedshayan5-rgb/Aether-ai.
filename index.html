<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aether AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0c10;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      padding-bottom: 240px;
    }
    .topbar {
      position: fixed; top: 0; left: 0; right: 0;
      height: 70px;
      background: rgba(10,12,16,0.95);
      backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; z-index: 100;
    }
    .logo { font-size: 30px; font-weight: bold; color: #2e6ff2; }

    .container { max-width: 1100px; margin: 100px auto 40px; padding: 0 15px; text-align: center; }
    h1 { font-size: 42px; font-weight: 300; }
    .subtitle { color: #aaa; margin: 10px 0 40px; }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 25px;
      margin-top: 30px;
    }
    .gallery img {
      width: 100%; border-radius: 22px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.7);
    }

    .command-center {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #14171c;
      border-top: 1px solid #2e6ff2;
      border-radius: 28px 28px 0 0;
      padding: 25px;
      box-shadow: 0 -15px 50px rgba(0,0,0,0.8);
    }
    textarea {
      width: 100%; height: 120px;
      background: #0a0c10;
      border: 2px solid #2e6ff2;
      border-radius: 18px;
      color: white;
      padding: 18px;
      font-size: 17px;
    }
    button {
      margin-top: 15px;
      width: 100%;
      padding: 18px;
      font-size: 19px;
      background: #2e6ff2;
      color: white;
      border: none;
      border-radius: 18px;
      font-weight: bold;
    }
    .loading { opacity: 0.7; }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="logo">Aether</div>
    <div>AI Studio</div>
  </div>

  <div class="container">
    <h1>Create Magic</h1>
    <p class="subtitle">ছবি আসতে ১৫-২৫ সেকেন্ড লাগতে পারে</p>
    <div class="gallery" id="gallery"></div>
  </div>

  <div class="command-center">
    <textarea id="prompt" placeholder="বিস্তারিত প্রম্পট লেখো..."></textarea>
    <button onclick="generateImage()" id="btn">Generate Image</button>
  </div>

  <script>
    async function generateImage() {
      const prompt = document.getElementById('prompt').value.trim();
      const btn = document.getElementById('btn');
      
      if (!prompt) {
        alert("প্রম্পট লিখো!");
        return;
      }

      btn.innerHTML = "ছবি তৈরি হচ্ছে... অপেক্ষা করো";
      btn.disabled = true;

      try {
        // নতুন API (এটা বেশিরভাগ সময় কাজ করে)
        const response = await fetch('https://api.limewire.ai/api/image/generation', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            prompt: prompt,
            samples: 1,
            quality: "high"
          })
        });

        const data = await response.json();
        if (data.data && data.data[0] && data.data[0].url) {
          const img = document.createElement('img');
          img.src = data.data[0].url;
          document.getElementById('gallery').prepend(img);
        } else {
          alert("ছবি পাওয়া যায়নি। আবার চেষ্টা করো।");
        }
      } catch(e) {
        alert("সার্ভারে সমস্যা। পরে আবার চেষ্টা করো।");
      }

      btn.innerHTML = "Generate Image";
      btn.disabled = false;
      document.getElementById('prompt').value = '';
    }
  </script>
</body>
</html>
